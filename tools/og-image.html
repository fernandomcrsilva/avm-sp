<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<style>
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  body { background: #071a2b; color: #fff; font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; position: relative; }
  .glow { position: absolute; right: -180px; top: -220px; width: 720px; height: 720px; border-radius: 50%; background: radial-gradient(circle, rgba(0,169,165,.45), rgba(0,169,165,0) 70%); }
  .brand { position: absolute; left: 72px; top: 64px; display: flex; align-items: center; gap: 18px; }
  .mark { width: 64px; height: 64px; display: grid; place-items: center; background: #d9f36a; color: #071a2b; border-radius: 20px 6px 20px 6px; font-weight: 850; font-size: 36px; }
  .brand strong { display: block; font-size: 26px; letter-spacing: .08em; }
  .brand small { display: block; color: #9db2c2; font-size: 17px; letter-spacing: .03em; }
  h1 { position: absolute; left: 72px; top: 180px; margin: 0; width: 1000px; font-size: 68px; line-height: 1.04; letter-spacing: -.04em; font-weight: 850; }
  p { position: absolute; left: 72px; top: 352px; margin: 0; width: 900px; color: #c9d6de; font-size: 28px; line-height: 1.3; }
  .range { position: absolute; left: 72px; bottom: 64px; display: flex; gap: 12px; align-items: center; color: #d9f36a; font-size: 26px; font-weight: 750; }
  .range i { display: inline-block; width: 220px; height: 10px; border-radius: 99px; background: linear-gradient(90deg, #4a687b, #00a9a5, #4a687b); }
  .url { position: absolute; right: 72px; bottom: 64px; color: #9db2c2; font-size: 26px; font-weight: 700; }
</style></head>
<body>
  <div class="glow"></div>
  <div class="brand"><span class="mark">A</span><span><strong>AVM/SP</strong><small>estimativa estatística de valor</small></span></div>
  <h1>Quanto vale este apartamento em São Paulo?</h1>
  <p>Faixa de valor com 80% de probabilidade, calculada no seu navegador a partir de transações reais de ITBI. Não é laudo.</p>
  <div class="range"><i></i> faixa antes do número</div>
  <div class="url">avm.heybrain.uk</div>
</body></html>
