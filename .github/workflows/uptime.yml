name: uptime
# Checagem sintética a cada 30 min. O site está atrás do Cloudflare Access e só o e-mail do dono entra (RUNBOOK
# "Acesso"), sem service token: a checagem confere que o domínio responde E continua fechado — 302 para o login
# do Access. Qualquer outra resposta (200 = aberto ao público, 5xx, timeout) falha o job e o GitHub avisa o dono.
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
permissions: {} # só curl para fora; nenhum acesso ao repositório
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: / e /version.json redirecionam para o login do Access
        run: |
          set -eu
          for path in / /version.json; do
            out=$(curl -sS --max-time 20 -o /dev/null -w '%{http_code} %{redirect_url}' "https://avm.heybrain.uk$path")
            echo "$path: $out"
            case "$out" in "302 https://heybrain.cloudflareaccess.com/"*) ;; *) echo "esperado 302 para o login do Access"; exit 1 ;; esac
          done
