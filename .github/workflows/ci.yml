name: ci
# lint → validador do model.json → paridade Python↔JS e limites → build → deploy.
# PR: publica uma versão de preview (wrangler versions upload) e comenta a URL.
# Produção: só em tag v* ou disparo manual (wrangler versions deploy). Nunca da máquina local.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: npm ci
      - name: Lint (sintaxe JS/Python e config do wrangler)
        run: npm run lint
      - name: Validador de schema do model.json
        run: npm run validate && python3 -m unittest tests.test_validate_model
      - name: Paridade Python↔JS e limites de aplicabilidade
        run: npm test
      - name: Build (fingerprint + version.json)
        run: npm run build
      - name: Orçamento de tamanho (JS+CSS inicial < 150 KB brotli)
        run: |
          sudo apt-get install -y -qq brotli >/dev/null
          total=0
          for f in dist/assets/styles.*.css dist/assets/app.*.js dist/assets/common.*.js dist/assets/predict.*.js dist/assets/xlsx-export.*.js dist/assets/matricula-reader.*.js dist/assets/vendor/tesseract.min.*.js; do
            b=$(brotli -q 11 -c "$f" | wc -c); total=$((total+b)); printf "%8d %s\n" "$b" "$f"
          done
          echo "total=$total bytes"; test "$total" -lt 153600

  preview:
    if: github.event_name == 'pull_request'
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: wrangler versions upload (preview)
        id: upload
        run: |
          out=$(npx wrangler versions upload --message "PR #${{ github.event.pull_request.number }} ${{ github.sha }}" 2>&1 | grep -viE "token|authorization")
          echo "$out"
          url=$(echo "$out" | grep -oE 'https://[a-z0-9.-]+\.workers\.dev' | head -1)
          id=$(echo "$out" | grep -oE 'Worker Version ID: [0-9a-f-]+' | awk '{print $4}')
          echo "url=$url" >> "$GITHUB_OUTPUT"; echo "id=$id" >> "$GITHUB_OUTPUT"
      - name: Comenta a URL de preview no PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr comment ${{ github.event.pull_request.number }} --repo ${{ github.repository }} --body "Preview desta revisão: ${{ steps.upload.outputs.url }} (versão \`${{ steps.upload.outputs.id }}\`, com X-Robots-Tag: noindex). Produção não foi alterada."

  deploy:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency: { group: deploy-production, cancel-in-progress: false }
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Exige o token
        run: test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::CLOUDFLARE_API_TOKEN ausente"; exit 1; }
      - name: wrangler versions upload
        id: upload
        run: |
          out=$(npx wrangler versions upload --tag "${{ github.ref_name }}" --message "${{ github.ref_name }} ${{ github.sha }}" 2>&1 | grep -viE "token|authorization")
          echo "$out"
          id=$(echo "$out" | grep -oE 'Worker Version ID: [0-9a-f-]+' | awk '{print $4}')
          test -n "$id"; echo "id=$id" >> "$GITHUB_OUTPUT"
      - name: wrangler versions deploy (100%)
        run: npx wrangler versions deploy "${{ steps.upload.outputs.id }}@100%" -y 2>&1 | grep -viE "token|authorization"
      - name: Confere o que está no ar
        run: |
          sleep 60   # propagação observada: até ~1 min
          curl -fsS --max-time 20 https://avm.heybrain.uk/version.json | tee version.json
          grep -q "\"git_sha\": \"${{ github.sha }}\"" version.json
