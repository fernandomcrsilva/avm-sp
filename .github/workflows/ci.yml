name: ci
# build → lint → validador do model.json → paridade Python↔JS e limites → orçamento de tamanho.
# Só portão de qualidade: quem constrói e publica é o Cloudflare Workers Builds, ligado ao repositório
# (npm run build + npx wrangler deploy a cada push em main). O CI não tem token da Cloudflare.
# Auditoria 2026-09-07: actions fixadas por SHA, GITHUB_TOKEN mínimo, valores do evento via env.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash # bash -eo pipefail: comando que falha dentro de um pipe derruba o passo

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: { python-version: "3.12" }
      - run: npm ci
      - name: Build (fingerprint + version.json; o lint do wrangler exige dist/)
        run: npm run build
      - name: Lint (sintaxe JS/Python e config do wrangler)
        run: npm run lint
      - name: Proveniência do vendor (site/assets/vendor/SHA256SUMS)
        run: cd site/assets/vendor && sha256sum --strict -c SHA256SUMS
      - name: Validador de schema do model.json
        run: npm run validate && python3 -m unittest tests.test_validate_model
      - name: Paridade Python↔JS e limites de aplicabilidade
        run: npm test
      - name: Orçamento de tamanho (JS+CSS inicial < 150 KB brotli)
        run: |
          sudo apt-get install -y -qq brotli >/dev/null
          total=0
          for f in dist/assets/styles.*.css dist/assets/app.*.js dist/assets/common.*.js dist/assets/predict.*.js dist/assets/xlsx-export.*.js dist/assets/matricula-reader.*.js dist/assets/vendor/tesseract.min.*.js; do
            b=$(brotli -q 11 -c "$f" | wc -c); total=$((total+b)); printf "%8d %s\n" "$b" "$f"
          done
          echo "total=$total bytes"; test "$total" -lt 153600

